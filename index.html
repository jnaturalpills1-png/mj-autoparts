    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }

    .card h3 { margin: 10px 0 5px 0; color: #003366; }
    .pines { font-weight: bold; color: #e67e22; font-size: 14px; }
    .descripcion { font-size: 13px; color: #555; margin: 8px 0; min-height: 36px; }
    .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; display: block; margin: 0 auto 20px auto; }
    .btn-add:hover { background: #218838; }

    function renderizar(conectores) {
      const grid = document.getElementById('connectorGrid');
      grid.innerHTML = '';
      conectores.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${c.imagen}" alt="${c.codigo}">
          <h3>${c.codigo}</h3>
          <div class="pines">${c.pines}</div>
          <div class="descripcion">${c.descripcion || 'Sin descripción'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarConectores() {
      const texto = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = conectoresIniciales.filter(c => 
        c.codigo.toLowerCase().includes(texto) ||
        c.pines.toLowerCase().includes(texto) ||
        (c.descripcion && c.descripcion.toLowerCase().includes(texto))
      );
      renderizar(filtrados);
    }
