<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M & J Distributors - Catálogo de Conectores</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: #1a2a3a; margin-bottom: 5px; }
        header p { color: #555; margin: 0; font-weight: bold; }
        .top-bar { display: flex; gap: 10px; max-width: 900px; margin: 0 auto 20px auto; }
        .search-input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .btn-add { background-color: #2b6cb0; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background-color: #2c5282; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .card img { width: 100%; height: 150px; object-fit: contain; border-radius: 4px; margin-bottom: 10px; background-color: #fafafa; }
        .card h3 { margin: 8px 0 4px 0; color: #1a2a3a; }
        .card p { margin: 4px 0; color: #666; font-size: 14px; }
        .tag { background-color: #ebf8ff; color: #2b6cb0; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .actions { display: flex; gap: 8px; margin-top: 12px; width: 100%; }
        .btn-action { flex: 1; padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-edit { background-color: #ed8936; color: white; }
        .btn-edit:hover { background-color: #dd6b20; }
        .btn-delete { background-color: #e53e3e; color: white; }
        .btn-delete:hover { background-color: #c53030; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-top: 0; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #38a169; color: white; border: none; padding: 10px; flex: 1; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #718096; color: white; border: none; padding: 10px; flex: 1; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Conectores y Plúgues</h1>
        <p>M & J Distributors</p>
    </header>

    <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por código (ej. 2837), descripción o pines..." onkeyup="filtrarCatalogo()">
        <button class="btn-add" onclick="abrirModalNuevo()">+ Añadir Nuevo Plúg</button>
    </div>

    <div class="grid-container" id="catalogoGrid"></div>

    <!-- MODAL DE CREAR / EDITAR -->
    <div class="modal" id="modalForm">
        <div class="modal-content">
            <h3 id="modalTitle">Añadir Plúg</h3>
            <input type="hidden" id="editIndex">
            <div class="form-group">
                <label>Código:</label>
                <input type="text" id="inputCodigo">
            </div>
            <div class="form-group">
                <label>Pines:</label>
                <input type="text" id="inputPines" placeholder="Ej. 3 PINES">
            </div>
            <div class="form-group">
                <label>Descripción / Tipo:</label>
                <input type="text" id="inputDescripcion" placeholder="Ej. CAM SENSOR TOYOTA">
            </div>
            <div class="form-group">
                <label>Imagen:</label>
                <input type="file" id="inputFile" accept="image/*" onchange="convertirImagen(event)">
                <img id="imagePreview" src="" style="max-width: 100px; display: none; margin-top: 10px;">
                <button type="button" id="btnQuitarFoto" onclick="quitarFoto()" style="display: none; margin-top: 5px; background: red; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Quitar foto</button>
            </div>
            <div class="modal-buttons">
                <button class="btn-save" onclick="guardarEntrada()">Guardar</button>
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Librerías Oficiales de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPHmtSreGyEcYCmowf-WHWILlWVQUhFHc",
            authDomain: "catalogo-mj.firebaseapp.com",
            databaseURL: "https://catalogo-mj-default-rtdb.firebaseio.com",
            projectId: "catalogo-mj",
            storageBucket: "catalogo-mj.firebasestorage.app",
            messagingSenderId: "749032896104",
            appId: "1:749032896104:web:c009538bc8fb1cb4ed2ddd",
            measurementId: "G-PDLXKH4Q63"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const refConectores = database.ref('conectores');

        let catalogo = [];
        let tempImagenBase64 = "";

        refConectores.on('value', (snapshot) => {
            const datos = snapshot.val();
            if (datos) {
                catalogo = Object.keys(datos).map(key => datos[key]);
            } else {
                catalogo = [];
            }
            filtrarCatalogo();
        });

        function extraerNumero(codigo) {
            const num = (codigo || '').replace(/\D/g, '');
            return parseInt(num, 10) || 0;
        }

        function renderizarGrid(lista) {
            lista.sort((a, b) => extraerNumero(a.codigo) - extraerNumero(b.codigo));
            const grid = document.getElementById('catalogoGrid');
            grid.innerHTML = '';
            lista.forEach((item) => {
                const originalIndex = catalogo.indexOf(item);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.imagen || 'https://via.placeholder.com/150?text=Sin+Foto'}" alt="${item.codigo}">
                    <h3>${item.codigo}</h3>
                    <p><strong>Pines:</strong> ${item.pines}</p>
                    <span class="tag">${item.descripcion}</span>
                    <div class="actions">
                        <button class="btn-action btn-edit" onclick="abrirModalEditar(${originalIndex})">✏️ Editar</button>
                        <button class="btn-action btn-delete" onclick="eliminarEntrada(${originalIndex})">🗑️ Borrar</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarCatalogo() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtrados = catalogo.filter(item => 
                (item.codigo || '').toLowerCase().includes(query) ||
                (item.descripcion || '').toLowerCase().includes(query) ||
                (item.pines || '').toLowerCase().includes(query)
            );
            renderizarGrid(filtrados);
        }

        function abrirModalNuevo() {
            document.getElementById('modalTitle').innerText = 'Añadir Plúg';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('inputCodigo').value = '';
            document.getElementById('inputPines').value = '';
            document.getElementById('inputDescripcion').value = '';
            quitarFoto();
            document.getElementById('modalForm').style.display = 'flex';
        }

        function abrirModalEditar(index) {
            const item = catalogo[index];
            document.getElementById('modalTitle').innerText = 'Editar Plúg';
            document.getElementById('editIndex').value = index;
            document.getElementById('inputCodigo').value = item.codigo;
            document.getElementById('inputPines').value = item.pines;
            document.getElementById('inputDescripcion').value = item.descripcion;
            tempImagenBase64 = item.imagen || '';
            
            const preview = document.getElementById('imagePreview');
            const btnQuitar = document.getElementById('btnQuitarFoto');
            if (item.imagen) {
                preview.src = item.imagen;
                preview.style.display = 'block';
                btnQuitar.style.display = 'inline-block';
            } else {
                preview.style.display = 'none';
                btnQuitar.style.display = 'none';
            }
            document.getElementById('modalForm').style.display = 'flex';
        }

        function convertirImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempImagenBase64 = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = tempImagenBase64;
                    preview.style.display = 'block';
                    document.getElementById('btnQuitarFoto').style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            }
        }

        function quitarFoto() {
            tempImagenBase64 = '';
            document.getElementById('inputFile').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('imagePreview').src = '';
            document.getElementById('btnQuitarFoto').style.display = 'none';
        }

        function guardarEntrada() {
            const codigo = document.getElementById('inputCodigo').value.trim();
            const pines = document.getElementById('inputPines').value.trim();
            const descripcion = document.getElementById('inputDescripcion').value.trim();

            if (!codigo) {
                alert("El campo 'Código' es obligatorio.");
                return;
            }

            const conectorId = codigo.replace(/[^a-zA-Z0-9_-]/g, '_');
            const nuevoItem = {
                id: conectorId,
                codigo: codigo,
                pines: pines,
                descripcion: descripcion,
                imagen: tempImagenBase64
            };

            refConectores.child(conectorId).set(nuevoItem);
            cerrarModal();
        }

        function eliminarEntrada(index) {
            const item = catalogo[index];
            if (confirm("¿Estás seguro de eliminar este plúg del catálogo?")) {
                const conectorId = item.id || item.codigo.replace(/[^a-zA-Z0-9_-]/g, '_');
                refConectores.child(conectorId).remove();
            }
        }

        function cerrarModal() {
            document.getElementById('modalForm').style.display = 'none';
        }
    </script>
</body>
</html>
